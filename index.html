<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TechsoftAI"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/app.css"><title>TechsoftAI Assistant</title></head><body><main id="app"><section id="login" class="screen active"><div class="brand"><div class="logo">T</div><h1>TechsoftAI</h1><p>Akıllı iş asistanınız</p></div><form id="loginForm" class="card"><label>Kullanıcı adı<input id="username" autocomplete="username" required placeholder="Kullanıcı adınız"></label><label>Şifre<input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label><button class="primary" type="submit">Giriş Yap</button><p class="hint">V1 demo: herhangi bir kullanıcı adı ve şifre ile giriş yapabilirsiniz.</p></form></section><section id="home" class="screen"><header><div><small>TechsoftAI Assistant</small><h2 id="hello">Merhaba 👋</h2></div><button id="logout" class="iconBtn">Çıkış</button></header><div class="summary"><div><b id="taskCount">3</b><span>Görev</span></div><div><b>1</b><span>Toplantı</span></div><div><b id="reminderCount">2</b><span>Hatırlatma</span></div></div><section class="assistant card"><h3>🤖 AI Asistan</h3><p>Görev, iş planı veya hatırlatma oluşturmak için yazın ya da konuşun.</p><div class="ask"><input id="aiInput" placeholder="Örn: Yarın 10'da Ahmet'i ara"><button id="mic">🎙️</button><button id="send">➤</button></div><div id="aiReply" class="reply">Size nasıl yardımcı olabilirim?</div></section><section class="card"><div class="sectionTitle"><h3>Bugün</h3><button id="addTask">+ Görev</button></div><div id="tasks"></div></section><nav><button class="nav active">🏠<span>Bugün</span></butt
